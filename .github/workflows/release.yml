name: release

# Tag-triggered — builds release binaries for linux x86_64 and macOS
# (aarch64 + x86_64) and attaches them to the GitHub release for the
# pushed tag. Mirrors sepia's release.yml staging; asset names match
# the `install-*` action probe convention:
#   hypha-x86_64-unknown-linux-gnu.tar.gz  (contains `hypha` + `hypha-hub`)
on:
  push:
    tags:
      - "v*"
      - "hypha-v*"

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-13
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - name: Build
        # `dist` profile: fat LTO + single codegen unit for shipped
        # binaries (release itself is thin LTO for fast local installs).
        run: |
          cargo build --locked --profile dist --target ${{ matrix.target }} \
            --bin hypha --bin hypha-hub
      - name: Stage
        run: |
          mkdir -p "dist/hypha-${{ matrix.target }}"
          cd "target/${{ matrix.target }}/dist"
          for b in hypha hypha-hub; do
            install -m 755 "$b" "$OLDPWD/dist/hypha-${{ matrix.target }}/"
          done
          tar -czf "$OLDPWD/hypha-${{ matrix.target }}.tar.gz" -C "$OLDPWD/dist" "hypha-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: hypha-${{ matrix.target }}
          path: hypha-${{ matrix.target }}.tar.gz

  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Release
        run: gh release create "${{ github.ref_name }}" --generate-notes hypha-*.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
